{% extends 'base.html' %}
{% load static %}
{% load humanize %}


{% block content %}
<!-- ====== بخش دسته‌بندی‌ها ====== -->
<section class="categories-section py-5">
    <div class="container px-4 px-lg-5">
        <!-- عنوان بخش -->
        <div class="text-center mb-5">
            <h2 class="display-5 fw-bolder text-gold">دسته‌بندی‌های فروشگاه</h2>
            <p class="text-muted">برای مشاهده محصولات، دسته‌بندی مورد نظر را انتخاب کنید</p>
        </div>

        <!-- شبکه کارت‌ها -->
        <div class="row g-4 justify-content-center">
            {% for category in categories %}
            <div class="col-6 col-md-4 col-lg-3">
                    <div class="category-card card h-100 text-center">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <!-- آیکون یا تصویر ساده (اختیاری) -->
                            <div class="category-icon mb-3">
                                <img class="card-img-top" src="{{ category.image.url }}" alt="تصویر دسته بندی" />
                            </div>
                            <!-- فقط نام دسته‌بندی -->
                            <a class="card-title fw-bolder text-gold" href="{% url 'category' category.id %}">
                                {{ category.name }}
                             </a>
                        </div>
                        <!-- افکت شیشه‌ای روی کارت -->
                        <div class="card-hover-effect"></div>
                    </div>
                </a>
            </div>
            {% empty %}
            <div class="col-12 text-center text-muted py-5">
                <i class="bi bi-inbox display-1 d-block mb-3"></i>
                <h4>هیچ دسته‌بندی یافت نشد!</h4>
            </div>
            {% endfor %}
        </div>
    </div>
    <br><br><br><br><br>
</section>

{% endblock %}
